; Localisation target "Game", step 2 of 3 (run by Tools\Localize.bat). R-TEC-08.
; Imports Content/Localization/Game/<culture>/Game.po (generated by Tools/loc_build.py --build from the per-table CSVs)
; into the archives under Saved/. The .po is the only translation input; it is never edited or merged by hand.
[CommonSettings]
SourcePath=%LOCPROJECTROOT%Content/Localization/Game
DestinationPath=%LOCPROJECTROOT%Saved/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

[GatherTextStep0]
CommandletClass=InternationalizationExport
bImportLoc=true
