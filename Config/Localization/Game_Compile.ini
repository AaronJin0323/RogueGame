; Localisation target "Game", step 3 of 3 (run by Tools\Localize.bat). R-TEC-08.
; Compiles the archives into Content/Localization/Game/<culture>/Game.locres (+ Game.locmeta), the path the engine
; loads by default ([Internationalization] LocalizationPaths in BaseGame.ini). Build products, never committed.
[CommonSettings]
SourcePath=%LOCPROJECTROOT%Saved/Localization/Game
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

[GatherTextStep0]
CommandletClass=GenerateTextLocalizationResource
