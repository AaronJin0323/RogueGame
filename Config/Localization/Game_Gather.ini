; Localisation target "Game", step 1 of 3 (run by Tools\Localize.bat). R-TEC-08.
; Gathers the string tables registered in C++ with LOCTABLE_FROMFILE_GAME (the gatherer reads the generated CSV the macro
; names) and writes the manifest and archives. These are intermediates: they live under Saved/ and are never committed.
[CommonSettings]
SourcePath=%LOCPROJECTROOT%Saved/Localization/Game
DestinationPath=%LOCPROJECTROOT%Saved/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/Dusktracer
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true
